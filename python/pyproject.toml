[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-framework-py"
version = "1.0.3"
description = "A unified identity, session, token, and permission framework with pluggable providers"
readme = "README.md"
authors = [
    {name = "Parthiv Rawat", email = "parthiv05022000@gmail.com"}
]
maintainers = [
    {name = "Parthiv Rawat", email = "parthiv05022000@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Typing :: Typed",
]
keywords = [
    "auth",
    "authentication",
    "authorization",
    "jwt",
    "oauth2",
    "rbac",
    "abac",
    "security",
    "session",
    "token",
    "policy",
    "permissions",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/parthivrawat/auth-framework"
Documentation = "https://github.com/parthivrawat/auth-framework/tree/main/python#readme"
Repository = "https://github.com/parthivrawat/auth-framework"
"Bug Tracker" = "https://github.com/parthivrawat/auth-framework/issues"
Changelog = "https://github.com/parthivrawat/auth-framework/blob/main/python/CHANGELOG.md"

[tool.setuptools]
py-modules = ["auth_framework"]

[tool.setuptools.packages.find]
where = ["."]
include = ["auth_framework*"]

[tool.pytest.ini_options]
testpaths = ["test_auth_framework.py"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
